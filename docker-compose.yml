version: '3.8'

services:
  # Supabase / PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/ddl/supabase_schema.sql:/docker-entrypoint-initdb.d/init.sql

  # WAHA WhatsApp HTTP API Engine (NOWEB / WebJS)
  waha:
    image: devlikeapro/waha:latest
    container_name: codflow-waha
    restart: always
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_PRINT_QR: "True"
    ports:
      - "3008:3000"
    volumes:
      - waha_sessions:/app/.sessions

  # COD Flow Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codflow-backend
    restart: always
    depends_on:
      - postgres
      - waha
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/codflow
      WAHA_API_URL: http://waha:3000
      WAHA_MOCK_MODE: "false"
      JWT_SECRET: codflow-super-secret-jwt-key-change-in-prod-2026
      ENCRYPTION_KEY: codflow-32-byte-encryption-secret-key!!
    ports:
      - "4000:4000"

  # COD Flow Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codflow-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  waha_sessions:
